<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>회원 가입</title>
    <style>
        .container { max-width: 560px; padding-top: 50px; }
        .field-error { border-color: #dc3545; color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="py-5 text-center">
        <h2>회원 가입</h2>
    </div>

    <form th:action="@{/members/new}" th:object="${memberForm}" method="post">

        <div class="mb-3">
            <label th:for="username" class="form-label">이름</label>
            <input type="text" th:field="*{username}" class="form-control"
                   placeholder="이름을 입력하세요"
                   th:class="${#fields.hasErrors('username')}? 'form-control field-error' : 'form-control'">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Incorrect date</p>
        </div>

        <div class="mb-3">
            <label th:for="loginId" class="form-label">ID</label>
            <input type="text" th:field="*{loginId}" class="form-control" placeholder="ID를 입력하세요">
        </div>
        <div class="mb-3">
            <label th:for="password" class="form-label">비밀번호</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="비밀번호를 입력하세요">
        </div>

        <div class="mb-3">
            <label th:for="city" class="form-label">도시</label>
            <input type="text" th:field="*{city}" class="form-control" placeholder="도시를 입력하세요">
        </div>

        <div class="mb-3">
            <label th:for="street" class="form-label">거리</label>
            <input type="text" th:field="*{street}" class="form-control" placeholder="거리를 입력하세요">
        </div>

        <div class="mb-3">
            <label th:for="zipcode" class="form-label">우편번호</label>
            <input type="text" th:field="*{zipcode}" class="form-control" placeholder="우편번호를 입력하세요">
        </div>

        <hr class="my-4">

        <div class="row">
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit">가입하기</button>
            </div>
            <div class="col">
                <button class="w-100 btn btn-secondary btn-lg"
                        onclick="location.href='index.html'"
                        th:onclick="|location.href='@{/}'|" type="button">취소</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
