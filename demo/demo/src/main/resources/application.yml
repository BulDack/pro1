app:
  upload:
    dir: C:/Users/bfbas/IdeaProjects/pro1/demo/demo/uploads

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/luna1
    username: root
    password: test1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        show_sql: true
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email


logging.level:
  org.hibernate.SQL: debug

jwt:
  secret: your-very-very-long-and-secure-secret-key-signature-example-1234567890
  access-token-expiration-time: 3600000 # 1시간 (밀리초 단위)
  refresh-token-expiration-time: 604800000 # 7일 (밀리초: 7 * 24 * 60 * 60 * 1000)


